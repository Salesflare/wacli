name: Fork release

# Builds the fork like upstream does (linux amd64/arm64 and windows amd64 on
# Linux, darwin amd64/arm64 on macOS), then publishes the archives with one
# checksums.txt and a build provenance attestation. Called by Fork update.

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to release
        required: true
        type: string
      tag:
        description: Release tag, e.g. v0.25.0-picture.1
        required: true
        type: string

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GORELEASER_SKIP: announce,aur,aur-source,chocolatey,docker,flatpak,homebrew,ko,makeself,mcp,nfpm,nix,notarize,publish,sbom,scoop,sign,snapcraft,srpm,validate,winget

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check inputs
        env:
          SHA: ${{ inputs.sha }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full commit id" >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-picture\.[0-9]+$ ]] || { echo "tag must look like v0.25.0-picture.1" >&2; exit 1; }

  linux-windows:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-env
        with:
          go-version-file: go.mod
          apt-packages: "build-essential gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-mingw-w64-x86-64"
      - name: Tag locally
        run: git tag -f "${{ inputs.tag }}" HEAD
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --config .goreleaser-linux-windows.yaml --clean --release-notes=/dev/null --skip=${{ env.GORELEASER_SKIP }}
      - name: Smoke test
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bin=$(find dist -path '*linux_amd64*' -name wacli -type f | head -n 1)
          "$bin" --version | grep -F "${TAG#v}"
          "$bin" sync --help | grep -q -- --profile-picture-budget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-windows
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  darwin:
    needs: check
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Tag locally
        run: git tag -f "${{ inputs.tag }}" HEAD
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --config .goreleaser.yaml --clean --release-notes=/dev/null --skip=${{ env.GORELEASER_SKIP }}
      - name: Smoke test
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bin=$(find dist -path '*darwin_arm64*' -name wacli -type f | head -n 1)
          "$bin" --version | grep -F "${TAG#v}"
          "$bin" sync --help | grep -q -- --profile-picture-budget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-darwin
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [linux-windows, darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz *.zip >checksums.txt
          cat checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          base=${TAG%-picture.*}
          {
            echo "Upstream wacli $base (openclaw/wacli) plus the read-only profile picture budget patch (\`sync --follow --profile-picture-budget N\`)."
            echo
            echo "Built by GitHub Actions from $SHA. macOS binaries are not signed or notarized."
            echo
            echo "Verify a download:"
            echo '```'
            echo "sha256sum --check --ignore-missing checksums.txt"
            echo "gh attestation verify <archive> --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >notes.md
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "wacli $TAG" --notes-file notes.md --latest
